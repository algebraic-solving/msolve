name: msolve CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  simd:
    name: SIMD (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: AVX-512F without BW
            flags: -mavx2 -mfma -mavx512f
            options: ''
            features: AVX2 FMA3 AVX512_F
          - target: AVX-512 extensions with AVX2 kernels disabled
            flags: -mavx512f -mavx512bw -mavx512dq -mavx512ifma
            options: --disable-avx2
            features: AVX512_F AVX512_BW AVX512_DQ AVX512_IFMA
          - target: BW and AVX2 kernels disabled
            flags: -mavx2 -mfma -mavx512f -mavx512bw
            options: --disable-avx512bw --disable-avx2
            features: AVX512_F
    env:
      CFLAGS: -O2 -march=x86-64 ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y libgmp-dev libflint-dev libmpfr-dev
      - run: ./autogen.sh
      - name: Check kernel selection
        env:
          OPTIONS: ${{ matrix.options }}
          FEATURES: ${{ matrix.features }}
        run: |
          read -ra options <<< "$OPTIONS"
          ./configure "${options[@]}"
          for feature in AVX2 FMA3 AVX512_F AVX512_BW AVX512_DQ AVX512_IFMA; do
            if [[ " $FEATURES " == *" $feature "* ]]; then
              grep -Fx "#define HAVE_$feature 1" config.h
            else
              grep -Fx "/* #undef HAVE_$feature */" config.h
            fi
          done
      - run: make -j2
      - name: Run tests if the CPU supports the target
        env:
          TARGET_FLAGS: ${{ matrix.flags }}
        run: |
          for flag in $TARGET_FLAGS; do
            if ! grep -qw "${flag#-m}" /proc/cpuinfo; then
              echo "Build passed. Skipping execution because the CPU lacks ${flag#-m}."
              exit 0
            fi
          done
          SEED=1617753600 make -j2 check
      - name: Reject explicitly requested BW on an F-only target
        if: matrix.target == 'AVX-512F without BW'
        run: |
          if ./configure --enable-avx512bw > explicit-bw.log 2>&1; then
            echo "Unexpectedly enabled AVX-512BW"
            exit 1
          fi
          grep -F -- '--enable-avx512bw requires' explicit-bw.log

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: bash }
          - { os: macos-latest, shell: bash }
          - { os: macos-26-intel, shell: bash }
          - { os: windows-latest, shell: msys2 }
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}
    steps:
      - name: Disable CRLF conversion on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
               git config --global core.autocrlf false
               git config --global core.eol lf
      - uses: actions/checkout@v6
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: "Install dependencies"
        run: |
               if [ "$RUNNER_OS" == "Linux" ]; then
                    # sharutils is for uudecode
                    sudo apt install libgmp-dev libflint-dev libmpfr-dev libntl-dev
               elif [ "$RUNNER_OS" == "macOS" ]; then
                    brew install autoconf automake libtool gmp flint mpfr ntl
               elif [ "$RUNNER_OS" == "Windows" ]; then
                    pacman -S --noconfirm autotools mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-gmp mingw-w64-ucrt-x86_64-flint mingw-w64-ucrt-x86_64-mpfr mingw-w64-ucrt-x86_64-ntl
               else
                    echo "$RUNNER_OS not supported"
                    exit 1
               fi
      - name: autogen
        run: ./autogen.sh
      - name: configure
        run: |
               if [ "$RUNNER_OS" == "Linux" ] || [ "$RUNNER_OS" == "Windows" ]; then
                    ./configure
               elif [ "$RUNNER_OS" == "macOS" ]; then
                    ./configure LDFLAGS="-L$(brew --prefix)/lib/" \
                    CFLAGS="-g -O2 -I$(brew --prefix)/include/"
               else
                    echo "$RUNNER_OS not supported"
                    exit 1
               fi
      - name: make
        run: make
      - name: make check
        run: make check
      - name: show test-suite.log if test failed
        if: failure()
        run: cat test-suite.log || true
      - name: make distcheck
        run: |
               if [ "$RUNNER_OS" == "Linux" ] || [ "$RUNNER_OS" == "Windows" ]; then
                    make distcheck
               elif [ "$RUNNER_OS" == "macOS" ]; then
                    make distcheck LDFLAGS="-L$(brew --prefix)/lib/" \
                    CFLAGS="-g -O2 -I$(brew --prefix)/include/"
               else
                    echo "$RUNNER_OS not supported"
                    exit 1
               fi
      - name: show test-suite.log if test failed
        if: failure()
        run: cat msolve-*/_build/sub/test-suite.log || true

  build-fixed-seed:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: bash }
          - { os: macos-latest, shell: bash }
          - { os: macos-26-intel, shell: bash }
          - { os: windows-latest, shell: msys2 }
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}
    steps:
      - name: Exercise the native SIMD kernels on Linux
        if: runner.os == 'Linux'
        run: echo 'CFLAGS=-O2 -march=native' >> "$GITHUB_ENV"
      - name: Disable CRLF conversion on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
               git config --global core.autocrlf false
               git config --global core.eol lf
      - uses: actions/checkout@v6
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: "Install dependencies"
        run: |
               if [ "$RUNNER_OS" == "Linux" ]; then
                    # sharutils is for uudecode
                    sudo apt install libgmp-dev libflint-dev libmpfr-dev libntl-dev
               elif [ "$RUNNER_OS" == "macOS" ]; then
                    brew install autoconf automake libtool gmp flint mpfr ntl
               elif [ "$RUNNER_OS" == "Windows" ]; then
                    pacman -S --noconfirm autotools mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-gmp mingw-w64-ucrt-x86_64-flint mingw-w64-ucrt-x86_64-mpfr mingw-w64-ucrt-x86_64-ntl
               else
                    echo "$RUNNER_OS not supported"
                    exit 1
               fi
      - name: autogen
        run: ./autogen.sh
      - name: configure
        run: |
               if [ "$RUNNER_OS" == "Linux" ] || [ "$RUNNER_OS" == "Windows" ]; then
                    ./configure
               elif [ "$RUNNER_OS" == "macOS" ]; then
                    ./configure LDFLAGS="-L$(brew --prefix)/lib/" \
                    CFLAGS="-g -O2 -I$(brew --prefix)/include/"
               else
                    echo "$RUNNER_OS not supported"
                    exit 1
               fi
      - name: make
        run: make
      - name: make check with fixed seed
        run: SEED=1617753600 make check
      - name: show test-suite.log if test failed
        if: failure()
        run: cat test-suite.log || true
      - name: make distcheck with fixed seed
        run: |
               if [ "$RUNNER_OS" == "Linux" ] || [ "$RUNNER_OS" == "Windows" ]; then
                    SEED=1617753600 make distcheck
               elif [ "$RUNNER_OS" == "macOS" ]; then
                    SEED=1617753600 make distcheck LDFLAGS="-L$(brew --prefix)/lib/" \
                    CFLAGS="-g -O2 -I$(brew --prefix)/include/"
               else
                    echo "$RUNNER_OS not supported"
                    exit 1
               fi
      - name: show test-suite.log if test failed
        if: failure()
        run: cat msolve-*/_build/sub/test-suite.log || true


  flintdev-assert-ntl:
    name: FLINT git version, compiled with assert and NTL
    runs-on: ubuntu-latest
    env:
      CC: "gcc"
    steps:
      - uses: actions/checkout@v6
      - name: "Setup"
        run: |
          sudo apt-get install -y libgmp-dev libmpfr-dev libntl-dev autoconf libtool-bin
          $CC --version
          make --version
          autoconf --version
          libtool --version
          echo "MAKE=make -j$(expr $(nproc) + 1) --output-sync=target" >> $GITHUB_ENV
      - name: "Build FLINT"
        run: |
          git clone --depth=1 https://github.com/flintlib/flint
          cd flint && ./bootstrap.sh && ./configure CC=${CC} --with-ntl --enable-assert
          $MAKE && sudo make install && sudo ldconfig
      - name: "Test FLINT"
        run: |
          cd flint && $MAKE tests && $MAKE check
        continue-on-error: true
      - name: "Build and Test msolve"
        run: |
          ./autogen.sh && ./configure && $MAKE && make check
      - name: show test-suite.log if test failed
        if: failure()
        run: cat test-suite.log || true

  flintdev-assert-ntl-fixed-seed:
    name: FLINT git version, compiled with assert and NTL, make check with fixed seed
    runs-on: ubuntu-latest
    env:
      CC: "gcc"
    steps:
      - uses: actions/checkout@v6
      - name: "Setup"
        run: |
          sudo apt-get install -y libgmp-dev libmpfr-dev libntl-dev autoconf libtool-bin
          $CC --version
          make --version
          autoconf --version
          libtool --version
          echo "MAKE=make -j$(expr $(nproc) + 1) --output-sync=target" >> $GITHUB_ENV
      - name: "Build FLINT"
        run: |
          git clone --depth=1 https://github.com/flintlib/flint
          cd flint && ./bootstrap.sh && ./configure CC=${CC} --with-ntl --enable-assert
          $MAKE && sudo make install && sudo ldconfig
      - name: "Test FLINT"
        run: |
          cd flint && $MAKE tests && $MAKE check
        continue-on-error: true
      - name: "Build and Test msolve"
        run: |
          ./autogen.sh && ./configure && $MAKE && SEED=1617753600 make check
      - name: show test-suite.log if test failed
        if: failure()
        run: cat test-suite.log || true
